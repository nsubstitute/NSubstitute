---
name: Build, Test, and Format verification
on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  test:
    strategy:
      matrix:
        os: [windows-latest, ubuntu-latest, macOS-latest]

    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            10.0.x
            9.0.x
            8.0.x

      - name: Build
        run: dotnet build

      - name: .NET Framework Tests
        if: matrix.os == 'windows-latest'
        run: dotnet test -f net462 --no-build --no-restore --no-progress

      - name: .NET 8 Tests
        run: dotnet test -f net8.0 --no-build --no-restore --no-progress

      - name: .NET 9 Tests
        run: dotnet test -f net9.0 --no-build --no-restore --no-progress

      - name: .NET 10 Tests
        run: dotnet test -f net10.0 --no-build --no-restore --no-progress

  format-verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Format
        run: dotnet format --verify-no-changes
